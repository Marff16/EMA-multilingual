[project]
name = "ema-language"
version = "0.1.0"
description = "Emergent misalignment that hides behind language: training, evaluation, detection and steering code."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # Pinned to tested versions.
  "torch==2.10.0",
  "transformers==5.5.0",
  "peft==0.19.1",
  "trl",
  "accelerate",
  "datasets",
  "openai>=2.0",
  "pyyaml",
  "pandas",
  "bitsandbytes",
  "numpy",
]

[project.urls]
Repository = "https://github.com/Marff16/EMA-multilingual"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ema_language"]
